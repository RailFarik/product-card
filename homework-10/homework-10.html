<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
</head>

<body>
    <main class="main">
        <div class="container">
            <h1 class="title">Выбери свой продукт</h1>
            <ul class="products clear-list">
                <button id="change-color-first-card">Сменить цвет первой карточки</button>
                <button id="change-color-all-cards">Сменить цвет всех карточек</button>
                <button id="open-google">Открыть страницу Google.com</button>
                <button id="output-console-log">Вывести сообщение в консоль лог</button>
                <button id="button-buy">Buy</button>
                <template class="product-template">
                    <li class="products__item card">
                        <img src="" alt="" class="card__image">
                        <h3 class="card__category"></h3>
                        <h2 class="card__name"></h2>
                        <p class="card__description"></p>
                        <div class="card__compound compound">
                            <span class="compound__title">Состав:</span>
                            <ul class="compound__list"></ul>
                        </div>
                        <div class="card__price price">
                            <b class="price__label">Цена:</b>
                            <span class="price__cost"></span>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </main>
    <script type="module" src="homework-10.js"></script>
</body>

</html>
